name: Подключение обработчика Telegram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-webhook.yml'
permissions:
  id-token: write
concurrency:
  group: telegram-webhook-production
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BOT_ORIGIN: https://arni-game-bot.vercel.app
    steps:
      - name: Проверить ответ на /start и зарегистрировать webhook
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          def request(label, url, body=None, headers=None):
              headers = dict(headers or {})
              if body is not None:
                  headers["Content-Type"] = "application/json"
              query = Request(url, data=None if body is None else json.dumps(body).encode(), headers=headers)
              try:
                  with urlopen(query, timeout=15) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"{label}: HTTP {error.code}") from None
              except Exception:
                  raise SystemExit(f"{label}: ошибка запроса") from None

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          if not token:
              raise SystemExit("Отсутствует секрет TELEGRAM_BOT_TOKEN.")

          def telegram(method, body=None):
              response = request(method, f"https://api.telegram.org/bot{token}/{method}", body)
              if not response.get("ok"):
                  raise SystemExit(f"Telegram отклонил {method}.")
              return response["result"]

          if telegram("getMe").get("username", "").lower() != "arnigame_bot":
              raise SystemExit("Токен принадлежит другому боту.")

          origin = os.environ["BOT_ORIGIN"]
          webhook = origin + "/api/telegram"
          existing = telegram("getWebhookInfo").get("url")
          if existing and existing != webhook:
              raise SystemExit("У бота уже есть другой webhook. Его настройки сохранены.")

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc = request("GitHub OIDC", oidc_url + separator + urlencode({"audience": "arni-game-bot-webhook-setup"}),
                         headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})["value"]
          secret = request("Настройка Vercel", origin + "/api/setup", {},
                           {"Authorization": "Bearer " + oidc})["secret"]
          print(f"::add-mask::{secret}")
          reply = request("Проверка /start", webhook,
                          {"message": {"text": "/start", "chat": {"id": 123, "type": "private"}}},
                          {"X-Telegram-Bot-Api-Secret-Token": secret})
          button = reply.get("reply_markup", {}).get("inline_keyboard", [[{}]])[0][0]
          if (reply.get("method") not in {"sendMessage", "sendPhoto"} or reply.get("chat_id") != 123
                  or button.get("url") != "https://t.me/arnigame_bot/arnigame_play"):
              raise SystemExit("Обработчик вернул неверную карточку.")
          print("Проверена карточка /start с кнопкой ARNI RUSH.")

          telegram("setWebhook", {"url": webhook, "secret_token": secret, "allowed_updates": ["message"]})
          if telegram("getWebhookInfo").get("url") != webhook:
              raise SystemExit("Telegram не подтвердил webhook.")
          print("Webhook @arnigame_bot подключён.")
          PY
